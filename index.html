<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOG ARCHIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #33ff66;
      --green-dim: #1f9e40;
      --green-faint: #0f4d20;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: var(--green);
      font: 22px/1.35 "VT323", "Courier New", monospace;
      text-shadow: 0 0 4px rgba(51, 255, 102, 0.55);
      animation: flicker 6s infinite;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background: repeating-linear-gradient(transparent 0 2px, rgba(0, 0, 0, 0.35) 3px);
    }

    body::after {
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.85));
    }

    @keyframes flicker {
      93% { opacity: 0.85; }
      94% { opacity: 1; }
      97% { opacity: 0.92; }
    }

    ::selection {
      background: var(--green);
      color: #000;
      text-shadow: none;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    h1,
    h2 {
      font-weight: normal;
    }

    h1 {
      font-size: 3rem;
      line-height: 1;
      letter-spacing: 0.08em;
      margin-bottom: 40px;
    }

    .log {
      border: 1px solid var(--green-faint);
      padding: 14px 16px 18px;
      margin-bottom: 22px;
    }

    .log h2 {
      font-size: 1rem;
      letter-spacing: 0.05em;
      border-bottom: 1px dashed var(--green-faint);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .log p + p {
      margin-top: 10px;
    }

    .empty {
      color: var(--green-dim);
    }

    @media (max-width: 520px) {
      body { font-size: 19px; }
      h1 { font-size: 2.3rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>LOG ARCHIVE</h1>

    <article class="log">
      <h2>LOG 001</h2>
      <p class="empty">[ NO DATA ]</p>
    </article>
  </main>
</body>
</html>
