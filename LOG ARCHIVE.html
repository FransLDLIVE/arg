<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOG ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #33ff66;
    --green-dim: #1f9e40;
    --green-faint: #0f4d20;
    --bg: #000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--green);
    font-family: "VT323", "Courier New", monospace;
    font-size: 22px;
    line-height: 1.35;
    min-height: 100%;
  }

  body {
    text-shadow: 0 0 4px rgba(51, 255, 102, 0.55);
    animation: flicker 6s infinite;
  }

  /* CRT scanlines + vignette */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.35) 3px
    );
    z-index: 10;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.85) 100%);
    z-index: 11;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.85; }
    94% { opacity: 1; }
    97% { opacity: 0.92; }
  }

  a { color: var(--green); }
  ::selection { background: var(--green); color: var(--bg); text-shadow: none; }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  header { margin-bottom: 40px; }
  h1 {
    font-weight: normal;
    font-size: 3rem;
    letter-spacing: 0.08em;
    line-height: 1;
  }

  /* log entries */
  .entry {
    border: 1px solid var(--green-faint);
    padding: 14px 16px 18px;
    margin-bottom: 22px;
  }
  .entry-head {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    border-bottom: 1px dashed var(--green-faint);
    padding-bottom: 6px;
    margin-bottom: 12px;
  }
  .entry-title { letter-spacing: 0.05em; }
  .entry-date { color: var(--green-dim); }
  .entry-body p { margin-bottom: 10px; }
  .entry-body p:last-child { margin-bottom: 0; }
  .empty { color: var(--green-dim); }

  @media (max-width: 520px) {
    html, body { font-size: 19px; }
    h1 { font-size: 2.3rem; }
  }
</style>
</head>
<body>
  <div class="wrap">

    <header>
      <h1>LOG ARCHIVE</h1>
    </header>

    <main>
      <!--
        To add a log: copy one <article class="entry"> block,
        change the number and text inside it.
      -->

      <article class="entry">
        <div class="entry-head">
          <span class="entry-title">LOG 001</span>
        </div>
        <div class="entry-body">
          <p class="empty">[ NO DATA ]</p>
        </div>
      </article>
    </main>

  </div>
</body>
</html>
